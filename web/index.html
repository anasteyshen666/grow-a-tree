<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Grow a Tree</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07090d; }
  canvas { display: block; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
             color: #6ce04c; font-family: monospace; font-size: 20px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="loading">LOADING…</div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("growtree.wasm"), go.importObject).then((result) => {
    document.getElementById("loading").remove();
    go.run(result.instance);
  }).catch((err) => {
    document.getElementById("loading").textContent = "Failed to load: " + err;
  });
</script>
</body>
</html>
